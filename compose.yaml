name: mediavault

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MEDIA_ACCEL: nginx
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
      GPU_RESOURCE: ${GPU_RESOURCE:-gpu:0}
      # Test seam for a full cursor walk. Leave unset in normal operation.
      PIPELINE_BATCH: ${PIPELINE_BATCH:-500}
      # Delete requests are refused unless the quarantine engine is explicitly on.
      FILE_MUTATION_ENGINE_ENABLED: ${FILE_MUTATION_ENGINE_ENABLED:-0}
      # Immutable HLS generations; off keeps the single fixed playlist path.
      HLS_GENERATIONS_ENABLED: ${HLS_GENERATIONS_ENABLED:-0}
      # Trigram index for the search box; 0 keeps every query on the LIKE scan.
      SEARCH_FTS_ENABLED: ${SEARCH_FTS_ENABLED:-1}
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT to the host media folder}
        target: /media
        bind:
          create_host_path: false
      - mediavault-data:/data
      - mediavault-cache:/cache
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      HWACCEL: ${HWACCEL:-}
      GPU_RESOURCE: ${GPU_RESOURCE:-gpu:0}
      SCAN_DELETE_GUARD_RATIO: ${SCAN_DELETE_GUARD_RATIO:-0.2}
      SCAN_DELETE_FORCE: ${SCAN_DELETE_FORCE:-0}
      WATCH_POLLING: ${WATCH_POLLING:-1}
      FILE_MUTATION_ENGINE_ENABLED: ${FILE_MUTATION_ENGINE_ENABLED:-0}
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT to the host media folder}
        target: /media
        bind:
          create_host_path: false
      - mediavault-data:/data
      - mediavault-cache:/cache

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIAVAULT_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT to the host media folder}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - mediavault-cache:/cache:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  mediavault-data:
  mediavault-cache:
