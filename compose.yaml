name: mediavault

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_ACCEL: nginx
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-15}
      GPU_RESOURCE: ${GPU_RESOURCE:-gpu:0}
    volumes:
      - ${MEDIA_ROOT:-./sample-media}:/media:ro
      - mediavault-data:/data
      - mediavault-cache:/cache
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      HWACCEL: ${HWACCEL:-}
      GPU_RESOURCE: ${GPU_RESOURCE:-gpu:0}
    volumes:
      - ${MEDIA_ROOT:-./sample-media}:/media:ro
      - mediavault-data:/data
      - mediavault-cache:/cache

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEDIAVAULT_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MEDIA_ROOT:-./sample-media}:/media:ro
      - mediavault-cache:/cache:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  mediavault-data:
  mediavault-cache:
