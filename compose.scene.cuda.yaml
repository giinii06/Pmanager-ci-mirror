# WSL2 / Linux: scene indexing on the NVIDIA GPU and the CPU text encoder.
#
#   docker compose --env-file .env --env-file .env.scene \
#     -f compose.yaml -f compose.scene.models.yaml \
#     -f compose.scene.cuda.yaml up -d --build
#
# The indexer takes the shared GPU lease, so it never overlaps ASR, translation
# or embedding. The query encoder runs on the CPU and answers while the card is
# busy, which is what lets a search box stay responsive during a long job.
services:
  api:
    environment:
      SCENE_WORKER_TOKEN: ${SCENE_WORKER_TOKEN:?set SCENE_WORKER_TOKEN to a long random string}
      SCENE_MODEL_ID: ${SCENE_MODEL_ID:-facebook/pe-av-base-16-frame}
      SCENE_MODEL_REVISION: ${SCENE_MODEL_REVISION:?set SCENE_MODEL_REVISION to a commit SHA}
      SCENE_PIPELINE_VERSION: ${SCENE_PIPELINE_VERSION:-1}
      SCENE_WINDOW_SECONDS: ${SCENE_WINDOW_SECONDS:-10}
      SCENE_OVERLAP_SECONDS: ${SCENE_OVERLAP_SECONDS:-2}
      # Same cap as the worker, so the queue's coverage figure matches the plan.
      SCENE_MAX_WINDOWS: ${SCENE_MAX_WINDOWS:-120}
      SCENE_QUERY_URL: http://scene-query:8091

  scene-worker:
    build:
      context: .
      dockerfile: apps/scene-worker/Dockerfile.cuda
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8787
      SCENE_WORKER_TOKEN: ${SCENE_WORKER_TOKEN:?set SCENE_WORKER_TOKEN to a long random string}
      SCENE_MODEL_DIR: /models/scene
      MEDIA_ROOT: /media
      SCENE_MODEL_ID: ${SCENE_MODEL_ID:-facebook/pe-av-base-16-frame}
      SCENE_MODEL_REVISION: ${SCENE_MODEL_REVISION:?set SCENE_MODEL_REVISION to a commit SHA}
      SCENE_TEMP_DIR: /scene-tmp
      SCENE_CACHE_DIR: /cache
      # Reuses the cut clip for the thumbnail, which saves a second seek into
      # the original file. Off by default because the clip is padded square.
      SCENE_THUMBNAIL_FROM_CLIP: ${SCENE_THUMBNAIL_FROM_CLIP:-0}
      # Caps the windows one job plans, so a long film cannot hold the card for
      # hours and starve ASR. The queue shows the sampled/total coverage.
      SCENE_MAX_WINDOWS: ${SCENE_MAX_WINDOWS:-120}
      # A stage that ignores cancellation cannot outlive this wall clock.
      SCENE_STAGE_TIMEOUT_SECONDS: ${SCENE_STAGE_TIMEOUT_SECONDS:-3600}
      # A single ffprobe/ffmpeg call inside a stage is bounded separately.
      SCENE_FFMPEG_TIMEOUT_SECONDS: ${SCENE_FFMPEG_TIMEOUT_SECONDS:-300}
      # The card is shared with ASR, translation and embedding, and the kind that
      # just released it lets another kind take the next turn. A scene job can
      # therefore wait for one ASR stage, which is longer than the default 15
      # minutes on a feature-length file.
      SCENE_GPU_WAIT_SECONDS: ${SCENE_GPU_WAIT_SECONDS:-3600}
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT to the host media folder}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EXTRA_MEDIA_ROOT:?set EXTRA_MEDIA_ROOT to the host extra media folder}
        target: /media/extra
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DRIVE_C_ROOT:?set DRIVE_C_ROOT to the host C drive mount}
        target: /media/drives/c
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DRIVE_D_ROOT:?set DRIVE_D_ROOT to the host D drive mount}
        target: /media/drives/d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DRIVE_E_ROOT:?set DRIVE_E_ROOT to the host E drive mount}
        target: /media/drives/e
        read_only: true
        bind:
          create_host_path: false
      - ./models:/models:ro
      - mediavault-cache:/cache
    depends_on:
      api:
        condition: service_healthy
      scene-model-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  scene-query:
    build:
      context: .
      dockerfile: apps/scene-worker/Dockerfile.cuda
    restart: unless-stopped
    command: ["python", "-m", "scene_worker.query"]
    environment:
      SCENE_MODEL_DIR: /models/scene
      SCENE_MODEL_ID: ${SCENE_MODEL_ID:-facebook/pe-av-base-16-frame}
      SCENE_QUERY_PORT: "8091"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models:/models:ro
    depends_on:
      scene-model-init:
        condition: service_completed_successfully
