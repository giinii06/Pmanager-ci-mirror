image: oven/bun:1.4.3

stages:
  - verify

default:
  tags:
    - oracle-arm64
  before_script:
    - bun install --frozen-lockfile

typecheck:
  stage: verify
  script:
    - bun run typecheck

unit-tests:
  stage: verify
  before_script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg
    - bun install --frozen-lockfile
  script:
    # CI checks out sources as root; a few fixture tests chmod source files.
    - chown -R bun:bun .
    # Permissions tests must not run as root: root bypasses chmod(000).
    - su -s /bin/sh bun -c 'LOG_LEVEL=error bun test'

web-build:
  stage: verify
  script:
    - bun run --cwd apps/web build

oracle_runner_test:
  stage: verify
  tags:
    - oracle-arm64
  before_script: []
  script:
    - echo "Oracle A1 Runner connected!"
    - test "$(uname -m)" = "aarch64"
    - bun --version

python-worker-tests:
  stage: verify
  image: python:3.12-slim
  before_script: []
  script:
    - python -m pip install --disable-pip-version-check --no-cache-dir 'pytest>=8.3,<10'
    - python -m pytest -q scripts/tests/test_gpu_clients.py
    # CPU-only modules: do not download CUDA, Torch, or model weights in CI.
    - PYTHONPATH=apps/asr-worker/src python -m pytest -q apps/asr-worker/tests/test_language.py
    - PYTHONPATH=apps/scene-worker/src python -m pytest -q apps/scene-worker/tests/test_checkpoint.py
    - PYTHONPATH=apps/embedding-worker/src python -m pytest -q apps/embedding-worker/tests
    - PYTHONPATH=apps/translation-worker/src python -m pytest -q apps/translation-worker/tests
