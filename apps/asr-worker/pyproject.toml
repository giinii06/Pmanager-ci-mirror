[project]
name = "mediavault-asr-worker"
version = "0.1.0"
description = "Korean ASR worker for MediaVault: Qwen3-ASR transcription plus Qwen3 forced alignment."
requires-python = ">=3.12,<3.13"
dependencies = [
  "qwen-asr==0.0.6",
  "torch>=2.9",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
