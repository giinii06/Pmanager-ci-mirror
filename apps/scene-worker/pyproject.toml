[project]
name = "mediavault-scene-worker"
version = "0.1.0"
description = "Scene search worker for MediaVault: PE-AV Base 16-frame windows on the shared GPU."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.15,<2.16",
  "torchvision>=0.29,<0.30",
  "transformers==5.23.0",
  "timm==1.0.31",
  "torchcodec==0.17.0",
  "pillow>=11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
