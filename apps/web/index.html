<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A1A1E" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand-icon.png?v=1" />
    <link rel="apple-touch-icon" href="/brand-icon.png?v=1" />
    <title>MediaVault</title>
    <script>
      ;(() => {
        try {
          var saved = localStorage.getItem('mediavault.themeMode')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var mode = ['light', 'ash', 'dark', 'onyx'].includes(saved)
            ? saved
            : prefersDark ? 'dark' : 'light'
          var root = document.documentElement
          root.dataset.theme = mode
          root.dataset.themeMode = mode
          root.style.colorScheme = mode === 'light' ? 'light' : 'dark'
          var backgrounds = { light: '#fbfbfb', ash: '#2e2e34', dark: '#1a1a1e', onyx: '#070709' }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', backgrounds[mode])
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
