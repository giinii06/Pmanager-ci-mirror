[project]
name = "mediavault-face-worker"
version = "0.1.0"
description = "Face detection and embedding worker for MediaVault: SCRFD and AntelopeV2 on the CPU."
requires-python = ">=3.12,<3.13"
dependencies = [
  "insightface==2.1",
  "onnxruntime==1.32.0",
  "numpy>=2,<3",
  "pillow>=11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
