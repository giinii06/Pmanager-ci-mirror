# MediaVault internal media gateway; Caddy is the public HTTPS ingress.
# The API answers with X-Accel-Redirect for thumbnails, previews, originals and
# HLS segments; those /internal/* locations are unreachable from the outside.

resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve Caddy's verified HTTPS indication for the proxied API.
# nginx is not published to the host; Caddy is the only browser ingress.
map $http_x_forwarded_proto $edge_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;
    sendfile on;
    tcp_nopush on;

    # Auth-checked originals. `alias` maps /internal/media/<rel> to /media/<rel>.
    location /internal/media/ {
        internal;
        alias /media/;
        add_header Accept-Ranges bytes;
        expires 7d;
    }

    # Generated thumbnails, previews and HLS output (versioned paths).
    location /internal/cache/ {
        internal;
        alias /cache/;
        add_header Accept-Ranges bytes;
        expires 30d;
    }

    location /health/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $api_upstream http://api:8787;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host keeps the port; the API compares Origin against it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $edge_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
