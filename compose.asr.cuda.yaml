# WSL2 / Linux: run the ASR worker on the NVIDIA GPU.
#
#   docker compose --env-file .env --env-file .env.asr \
#     -f compose.yaml -f compose.asr.models.yaml \
#     -f compose.asr.cuda.yaml up -d --build
#
# One ASR job runs at a time, and the worker exits its model process between
# transcription and alignment so an 8 GB card never holds both models.
services:
  api:
    environment:
      ASR_WORKER_TOKEN: ${ASR_WORKER_TOKEN:?set ASR_WORKER_TOKEN to a long random string}
      ASR_RESULT_DIR: /asr-results
      ASR_MODEL_REVISION: ${ASR_MODEL_REVISION:?set ASR_MODEL_REVISION to a commit SHA}
      ALIGN_MODEL_REVISION: ${ALIGN_MODEL_REVISION:?set ALIGN_MODEL_REVISION to a commit SHA}
      ASR_PIPELINE_VERSION: ${ASR_PIPELINE_VERSION:-3}
    volumes:
      - ./asr-results:/asr-results

  asr-worker:
    build:
      context: .
      dockerfile: apps/asr-worker/Dockerfile.cuda
    restart: unless-stopped
    environment:
      ASR_DEVICE: cuda
      API_BASE_URL: http://api:8787
      ASR_MODEL_DIR: /models/asr
      ALIGN_MODEL_DIR: /models/aligner
      ASR_MODEL_ID: ${ASR_MODEL_ID:-TeamUNIVA/qwen3_asr_1.7b_ko}
      ALIGN_MODEL_ID: ${ALIGN_MODEL_ID:-Qwen/Qwen3-ForcedAligner-0.6B}
      LANGID_MODEL_ID: ${LANGID_MODEL_ID:-openai/whisper-small}
      ASR_MODEL_REVISION: ${ASR_MODEL_REVISION:?set ASR_MODEL_REVISION to a commit SHA}
      ALIGN_MODEL_REVISION: ${ALIGN_MODEL_REVISION:?set ALIGN_MODEL_REVISION to a commit SHA}
      LANGID_MODEL_REVISION: ${LANGID_MODEL_REVISION:?set LANGID_MODEL_REVISION to a commit SHA}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      LANGID_MODEL_DIR: /models/langid
      LANGID_SAMPLES: ${LANGID_SAMPLES:-5}
      LANGID_MIN_CONFIDENCE: ${LANGID_MIN_CONFIDENCE:-0.50}
      LANGID_MIN_MARGIN: ${LANGID_MIN_MARGIN:-0.20}
      ASR_PIPELINE_VERSION: ${ASR_PIPELINE_VERSION:-3}
      ASR_WORKER_TOKEN: ${ASR_WORKER_TOKEN:?set ASR_WORKER_TOKEN to a long random string}
      MEDIA_ROOT: /media
      RESULT_DIR: /asr-results
      # The card is shared, and the kind that just released it waits one turn.
      # An ASR job can therefore sit behind a translation job, which is longer
      # than the ten-minute default.
      GPU_WAIT_SECONDS: ${ASR_GPU_WAIT_SECONDS:-1800}
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${MEDIA_ROOT:-./sample-media}:/media:ro
      - ${EXTRA_MEDIA_ROOT:-./sample-media}:/media/extra:ro
      - ./models:/models:ro
      - ./asr-results:/asr-results
    depends_on:
      api:
        condition: service_healthy
      asr-model-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
