# One-shot download of the AntelopeV2 ONNX pack. Weights live on the host in
# ./models/face so image rebuilds never re-download them.
#
#   docker compose --env-file .env --env-file .env.face \
#     -f compose.yaml -f compose.face.models.yaml run --rm face-model-init
services:
  face-model-init:
    build:
      context: .
      dockerfile: apps/face-model-init/Dockerfile
    restart: "no"
    environment:
      FACE_MODEL_ID: ${FACE_MODEL_ID:-antelopev2}
      FACE_MODEL_REVISION: ${FACE_MODEL_REVISION:?set FACE_MODEL_REVISION to a release tag}
    volumes:
      - ./models:/models
